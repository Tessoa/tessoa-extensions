# Texts for the extension catalog entry of this plugin.
min_host = "0.30.0"
author = "tessoa"
homepage = "https://github.com/Tessoa/tessoa-extensions/tree/main/plugins/csv-table"

[name]
en = "CSV table"
zh = "CSV 表格"

[desc]
en = "Shows a CSV file as a table, the one selected in the tab group it follows, or one you open or drop on it, which stays until you change what it follows; lists the files viewed; sorts by any column and copies the selected rows"
zh = "以表格显示 CSV 文件（跟随某个标签组的选中；自己打开或拖入的文件会停住，直到改选跟随；右侧列出看过的文件），可按任意列排序并复制选中的行"
