# A file dropped on the page opens, whatever its name, and stays: the .csv
# files selected in the followed group no longer replace it, until the user
# chooses another binding on the chip. It stays after a restart.
name = "A dropped file opens and stays until the chip changes"

[[files]]
from = "csv/people.csv"

[[files]]
from = "csv/cities.csv"
as = "cities.txt"

[[steps]]
open-page = "csv"
expect-tree-contains = { kind = "drop-zone", key = "drop", count = 1 }

[[steps]]
follow = { group = 1, file = "people.csv" }
expect-title = "people.csv"

# Of several files, the first opens.
[[steps]]
drop-files = { onto = "drop", files = ["cities.txt", "people.csv"] }
expect-title = "cities.txt"
expect-rows = { on = "rows", count = 3 }
expect-text = { key = "hold", contains = "Staying on this file" }

[[steps]]
follow = { group = 1, file = "people.csv" }
expect-title = "cities.txt"

[[steps]]
restart = true
expect-title = "cities.txt"
expect-rows = { on = "rows", count = 3 }

# The user chooses group 2 on the chip: the page follows again.
[[steps]]
follow = { group = 2, file = "people.csv" }
expect-title = "people.csv"
expect-text = [{ key = "status", text = "25 rows" }, { key = "hold", text = "" }]
