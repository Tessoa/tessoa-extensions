# The "Follow selection" switch: off, a .csv file selected in the followed
# group does not replace the one shown; on again, the page shows the file
# selected at that moment. The page keeps the switch across restarts.
name = "The follow switch stops following and starts it again"

[[files]]
from = "csv/people.csv"

[[files]]
from = "csv/cities.csv"

[[steps]]
open-page = "csv"
expect-value = { key = "follow", value = true }

[[steps]]
follow = { group = 1, file = "people.csv" }
expect-title = "people.csv"

[[steps]]
toggle = "follow"
expect-value = { key = "follow", value = false }

[[steps]]
follow = { group = 1, file = "cities.csv" }
expect-title = "people.csv"
expect-text = { key = "status", text = "25 rows" }

[[steps]]
restart = true
expect-value = { key = "follow", value = false }

[[steps]]
toggle = "follow"
expect-value = { key = "follow", value = true }
expect-title = "cities.csv"
expect-rows = { on = "rows", count = 3 }

[[steps]]
restart = true
expect-value = { key = "follow", value = true }
expect-title = "cities.csv"
