# The "Follow selection" switch: off, a .json file selected in the followed
# group does not replace the one shown; on again, the page shows the file
# selected at that moment. The page keeps the switch across restarts.
name = "The follow switch stops following and starts it again"

[[files]]
from = "json/catalog.json"

[[files]]
from = "json/small.json"

[[steps]]
open-page = "json"
expect-value = { key = "follow", value = true }

[[steps]]
follow = { group = 1, file = "catalog.json" }
expect-title = "catalog.json"

[[steps]]
toggle = "follow"
expect-value = { key = "follow", value = false }

[[steps]]
follow = { group = 1, file = "small.json" }
expect-title = "catalog.json"
expect-rows = { on = "json", count = 8 }

[[steps]]
restart = true
expect-value = { key = "follow", value = false }

[[steps]]
toggle = "follow"
expect-value = { key = "follow", value = true }
expect-title = "small.json"
expect-rows = { on = "json", count = 2, ids = ["$.id", "$.tags"] }

[[steps]]
restart = true
expect-value = { key = "follow", value = true }
expect-title = "small.json"
