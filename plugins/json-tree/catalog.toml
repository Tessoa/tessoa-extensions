# Texts for the extension catalog entry of this plugin.
min_host = "0.30.0"
author = "tessoa"
homepage = "https://github.com/Tessoa/tessoa-extensions/tree/main/plugins/json-tree"

[name]
en = "JSON viewer"
zh = "JSON 查看器"

[desc]
en = "Shows a JSON file as a tree, the one selected in the tab group it follows, or one you open or drop on it, which stays until you change what it follows; lists the files viewed; copies the path or value of any entry"
zh = "以树形结构显示 JSON 文件（跟随某个标签组的选中；自己打开或拖入的文件会停住，直到改选跟随；右侧列出看过的文件），可复制任意条目的路径或值"
